<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — LifePilot AI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e2e8f0; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: #94a3b8; max-width: 340px; line-height: 1.5; }
    button { margin-top: 16px; background: linear-gradient(90deg, #6366f1, #a855f7); color: white; border: 0; padding: 12px 22px; border-radius: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>LifePilot needs a connection to sync your planner. Alarms already synced to your Android phone will still ring.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
